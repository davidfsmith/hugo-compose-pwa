<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #111; color: #fff; }
    canvas { display: none; }
    button { background: #bf5af2; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 8px; }
    .status { margin-top: 16px; color: #aeaeb2; }
  </style>
</head>
<body>
  <h2>Icon Generator</h2>
  <p style="color:#aeaeb2">Click to generate and download PNG icons for the PWA.</p>
  <button onclick="generate(192)">Download icon-192.png</button>
  <button onclick="generate(512)">Download icon-512.png</button>
  <button onclick="generate(180)">Download icon-180.png (iOS)</button>
  <div class="status" id="status"></div>
  <canvas id="c"></canvas>
  <script>
    function generate(size) {
      const canvas = document.getElementById('c');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const s = size;

      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, s, s);
      grad.addColorStop(0, '#bf5af2');
      grad.addColorStop(1, '#7c3aed');
      const r = s * 0.208;

      // Rounded rect background
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(s - r, 0);
      ctx.quadraticCurveTo(s, 0, s, r);
      ctx.lineTo(s, s - r);
      ctx.quadraticCurveTo(s, s, s - r, s);
      ctx.lineTo(r, s);
      ctx.quadraticCurveTo(0, s, 0, s - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      const lw = s * 0.052;
      ctx.strokeStyle = 'white';
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = s / 2, cy = s * 0.604;

      // Camera body
      const bx = s * 0.167, by = s * 0.375, bw = s * 0.667, bh = s * 0.458, br = s * 0.073;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, br);
      ctx.stroke();

      // Lens outer
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.146, 0, Math.PI * 2);
      ctx.stroke();

      // Lens inner (filled)
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.063, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fill();

      // Viewfinder bump
      ctx.beginPath();
      ctx.moveTo(s * 0.364, s * 0.375);
      ctx.lineTo(s * 0.417, s * 0.271);
      ctx.lineTo(s * 0.583, s * 0.271);
      ctx.lineTo(s * 0.636, s * 0.375);
      ctx.strokeStyle = 'white';
      ctx.stroke();

      // Flash dot
      ctx.beginPath();
      ctx.arc(s * 0.771, s * 0.469, s * 0.036, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();

      // Download
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

      document.getElementById('status').textContent = `✓ Downloaded icon-${size}.png — place it in site/static/compose/`;
    }
  </script>
</body>
</html>
